name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: docker.io/grado/pdm:3.12-alpine

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          uv sync

      - name: Lint
        run: |
          uv run inv format --check

      - name: Run Tests
        run: |
          uv run pytest tests
